# Board-independent configuration.

substitutions:
  device_name: plant-watering
  friendly_name: Plant Watering
  pump_max_run_time_seconds: "30"
  allow_simultaneous_pumps: "false"
  dry_percent_threshold: "35"
  saturated_percent_threshold: "90"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  on_boot:
    - priority: -100
      then:
        - light.turn_on:
            id: onboard_led
            red: 100%
            green: 0%
            blue: 0%
            brightness: 25%

external_components:
  - source:
      type: local
      path: components
    components: [pbhub]

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_ap_password
  on_connect:
    - light.turn_off: onboard_led
  on_disconnect:
    - light.turn_on:
        id: onboard_led
        red: 100%
        green: 0%
        blue: 0%
        brightness: 25%

captive_portal:

i2c:
  id: grove_i2c
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  frequency: 100kHz
  scan: true

pbhub:
  id: watering_pbhub
  i2c_id: grove_i2c
  address: 0x61
  allow_simultaneous_pumps: ${allow_simultaneous_pumps}

light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    name: "Status LED"
    icon: mdi:led-on
    entity_category: config
    pin: ${led_pin}
    chipset: ${led_chipset}
    num_leds: 1
    rgb_order: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

packages:
  plant_1: !include
    file: plant.yaml
    vars:
      index: 1
      dry_raw: 2200
      wet_raw: 1700
      disabled: "false"

  plant_2: !include
    file: plant.yaml
    vars:
      index: 2
      dry_raw: 2200
      wet_raw: 1700
      disabled: "false"

  plant_3: !include
    file: plant.yaml
    vars:
      index: 3
      dry_raw: 2200
      wet_raw: 1700
      disabled: "true"

  plant_4: !include
    file: plant.yaml
    vars:
      index: 4
      dry_raw: 2200
      wet_raw: 1700
      disabled: "true"

  plant_5: !include
    file: plant.yaml
    vars:
      index: 5
      dry_raw: 2200
      wet_raw: 1700
      disabled: "true"

  plant_6: !include
    file: plant.yaml
    vars:
      index: 6
      dry_raw: 2200
      wet_raw: 1700
      disabled: "true"
