name: Validate firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - atoms3-lite
          - atom-lite
    name: Validate (${{ matrix.board }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create secrets.yaml
        run: cp secrets.example.yaml secrets.yaml

      - name: Validate ESPHome config
        run: make validate BOARD=${{ matrix.board }}

      - name: Compile firmware
        run: make compile BOARD=${{ matrix.board }}
